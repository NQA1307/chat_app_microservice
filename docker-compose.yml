version: '3.8'

services:
  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user-dev
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5532:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - discord-net

  postgres-server:
    image: postgres:16-alpine
    container_name: postgres-server-dev
    environment:
      POSTGRES_DB: server_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5533:5432"
    volumes:
      - postgres-server-data:/var/lib/postgresql/data
    networks:
      - discord-net

  postgres-message:
    image: postgres:16-alpine
    container_name: postgres-message-dev
    environment:
      POSTGRES_DB: message_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5534:5432"
    volumes:
      - postgres-message-data:/var/lib/postgresql/data
    networks:
      - discord-net

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6380:6379"
    networks:
      - discord-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5773:5672"
      - "15773:15672"
    networks:
      - discord-net

volumes:
  postgres-user-data:
  postgres-server-data:
  postgres-message-data:

networks:
  discord-net:
    driver: bridge
