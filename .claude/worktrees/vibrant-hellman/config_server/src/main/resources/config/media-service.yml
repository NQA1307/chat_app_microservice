server:
  port: ${MEDIA_SERVICE_PORT}

spring:
  datasource:
    url: ${MEDIA_DB_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  media:
    upload-dir: media_uploads
    public-base-url: ${MEDIA_PUBLIC_BASE_URL}

clients:
  server-service:
    base-url: ${SERVER_SERVICE_BASE_URL}

internal:
  service-secret: ${INTERNAL_SERVICE_SECRET}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
