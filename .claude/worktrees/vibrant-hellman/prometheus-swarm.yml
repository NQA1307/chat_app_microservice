global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "discord-clone-swarm-services"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "api-gateway:8080"
          - "user-service:8081"
          - "server-service:8082"
          - "message-service:8084"
          - "media-service:8085"
          - "voice-service:8086"
          - "notification-service:8087"
          - "config-server:8888"
          - "eureka-server:8761"
