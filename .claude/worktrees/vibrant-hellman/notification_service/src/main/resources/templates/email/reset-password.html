<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f9; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { background-color: #ED4245; padding: 30px; text-align: center; color: #ffffff; }
        .content { padding: 36px; line-height: 1.6; color: #333333; }
        .code-box { background-color: #fff1f1; border: 1px dashed #ED4245; border-radius: 6px; padding: 20px; text-align: center; margin: 24px 0; }
        .code { font-size: 32px; font-weight: bold; letter-spacing: 5px; color: #ED4245; }
        .footer { background-color: #f9fafb; padding: 20px; text-align: center; font-size: 12px; color: #777777; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Password reset</h1>
    </div>
    <div class="content">
        <p>Hello,</p>
        <p>Use the code below to reset your password.</p>

        <div class="code-box">
            <div class="code" th:text="${code}">123456</div>
        </div>

        <p>This code expires in <strong th:text="${expiresInMinutes}">10</strong> minutes.</p>
        <p>If you did not request a password reset, ignore this email and keep your current password.</p>
    </div>
    <div class="footer">
        <p>&copy; 2026 Discord Clone Project. This is an automated email.</p>
    </div>
</div>
</body>
</html>
