  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6380:6379"
    networks:
      - discord-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-dev
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_identity_allow_remote_guest_context true"
    ports:
      - "5773:5672"
      - "15773:15672"
      - "61613:61613"
    networks:
      - discord-net
  meilisearch:
    image: getmeili/meilisearch:v1.26.0
    container_name: meilisearch-dev
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    networks:
      - discord-net
  livekit:
    image: livekit/livekit-server:latest
    container_name: discord_clone_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - discord-net
  # postgres-voice:
  #   image: postgres:16-alpine
  #   container_name: postgres-voice-dev
  #   environment:
  #     POSTGRES_DB: voice_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - "5537:5432"
  #   volumes:
  #     - postgres-voice-data:/var/lib/postgresql/data
  #   networks:
  #     - discord-net
  prometheus:
    image: quay.io/prometheus/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - discord-net

  grafana:
    image: mirror.gcr.io/grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - discord-net

volumes:
  # postgres-user-data:
