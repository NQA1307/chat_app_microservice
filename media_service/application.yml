server:
  port: ${MEDIA_SERVICE_PORT:8085}

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://localhost:5535/media_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  media:
    upload-dir: media_uploads
    public-base-url: ${MEDIA_PUBLIC_BASE_URL:http://localhost:8080}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

logging:
  level:
    com.discordclone: DEBUG
