server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**

        - id: user-service-users
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            - name: JwtAuth

        - id: user-service-friends
          uri: lb://user-service
          predicates:
            - Path=/api/friends/**
          filters:
            - name: JwtAuth

        - id: server-service
          uri: lb://server-service
          predicates:
            - Path=/api/servers/**
          filters:
            - name: JwtAuth

        - id: message-service-rest
          uri: lb://message-service
          predicates:
            - Path=/api/messages,/api/messages/**
          filters:
            - name: JwtAuth

        - id: message-service-dm
          uri: lb://message-service
          predicates:
            - Path=/api/dm/**
          filters:
            - name: JwtAuth

        - id: message-service-ws
          uri: lb://message-service
          predicates:
            - Path=/ws/**

        - id: media-service-files
          uri: lb://media-service
          predicates:
            - Path=/api/media/files/**

        - id: media-service
          uri: lb://media-service
          predicates:
            - Path=/api/media/**
          filters:
            - name: JwtAuth

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: JwtAuth

        - id: voice-service
          uri: lb://voice-service
          predicates:
            - Path=/api/voice/**
          filters:
            - name: JwtAuth

  codec:
    max-in-memory-size: 20MB

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
